[project]
name = "comfyui-qnn"
version = "0.2.1"
description = "Optional Snapdragon NPU SD 1.5 and SDXL nodes for ComfyUI"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/tracer99/ComfyUI-QNN"
Issues = "https://github.com/tracer99/ComfyUI-QNN/issues"

[tool.comfy]
DisplayName = "Snapdragon Diffusion for ComfyUI"

[tool.release]
files = [
    "__init__.py",
    "qnn_sd15.py",
    "qnn_sdxl.py",
    "requirements-sdxl-worker.txt",
    "tools/download_sdxl.py",
    "NOTICE",
    "workflow-sdxl.json",
    "workflow-sdxl-api.json",
    "pyproject.toml",
    "requirements.txt",
    "requirements-worker.txt",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "RELEASING.md",
    "workflow.json",
    "workflow-api.json",
    "findings/summary.json",
    "findings/comparison.jpg",
]
